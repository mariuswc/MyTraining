server:
  port: 8080

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/MyWorkoutApp
    username: myuser
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate

google:
  oauth:
    client.id: ${CLIENT_ID}
    client.secret: ${CLIENT_SECRET}
    redirect.uri: http://localhost:8080/auth/google/callback

